{
  "name": "Feature request",
  "description": "Explain a user need or suggest an improvement.",
  "title": "[Idea] ",
  "labels": [
    "enhancement",
    "needs-triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This ticket is PUBLIC. Use fictional examples. Do not include health history, body measurements, personal allergy profiles, exports, payment information, passwords, or complete logs. For security flaws or unintended data exposure, stop and use [private vulnerability reporting](https://github.com/lukaluka/savorloop-community/security/advisories/new). SavorLoop is currently in development; see the availability guide."
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I searched existing issues and checked the relevant guide.",
            "required": true
          },
          {
            "label": "I understand this issue is public and have removed sensitive and personal information.",
            "required": true
          },
          {
            "label": "This is not a private security vulnerability report.",
            "required": true
          }
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "What problem would this solve?",
        "description": "Describe a use case with fictional examples."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "Proposed improvement"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "alternatives",
      "attributes": {
        "label": "Alternatives or current workaround",
        "description": "Optional. A request is not a delivery commitment."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "accessibility",
      "attributes": {
        "label": "Accessibility or privacy considerations",
        "description": "Optional. Do not disclose a diagnosis or private data."
      },
      "validations": {
        "required": false
      }
    }
  ],
  "assignees": [
    "lukaluka"
  ]
}
