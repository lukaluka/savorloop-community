{
  "name": "Usage question / support ticket",
  "description": "Ask for help using SavorLoop or understanding a guide.",
  "title": "[Help] ",
  "labels": [
    "support",
    "needs-triage"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This ticket is PUBLIC. Use fictional examples. Do not include health history, body measurements, personal allergy profiles, exports, payment information, passwords, or complete logs. For security flaws or unintended data exposure, stop and use [private vulnerability reporting](https://github.com/lukaluka/savorloop-community/security/advisories/new). SavorLoop is currently in development; see the availability guide."
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I searched existing issues and checked the relevant guide.",
            "required": true
          },
          {
            "label": "I understand this issue is public and have removed sensitive and personal information.",
            "required": true
          },
          {
            "label": "This is not a private security vulnerability report.",
            "required": true
          }
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "App / build version",
        "description": "If unavailable, say unknown. Food-library and app versions are different."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "topic",
      "attributes": {
        "label": "Screen, feature, or guide"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "question",
      "attributes": {
        "label": "What are you trying to do?",
        "description": "Describe the task without personal or health information."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "tried",
      "attributes": {
        "label": "What have you tried or read?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "result",
      "attributes": {
        "label": "What would a helpful answer explain?"
      },
      "validations": {
        "required": true
      }
    }
  ],
  "assignees": [
    "lukaluka"
  ]
}
